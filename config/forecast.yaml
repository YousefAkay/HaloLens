# forecast.yaml — owned by FCT. INT created the agreed keys; FCT tunes values and adds keys.

baselines:
  trailing_window_years: 3        # B1: trailing mean window, years before the cutoff
  market_anchor_series: rent_cpi  # B2: `metric` value in sources.csv used as the market anchor (placeholder until MSR's M-03 fixes the names)
  market_gap_window_years: 3      # B2: years before the cutoff used to learn the internal-minus-market gap

incentives:
  trend_window_years: 2           # years of discount-share history used for the linear trend (2 = line through the last two years)
  min_leases_per_cell: 5          # a segment-year (or base-year) cell with fewer leases is ignored; the segment falls back to its province pool
  max_discount_share: 0.5         # extrapolated discount share is clipped to [0, this]: a trend must not give away more than half the rent

linking:
  recon_tolerance_dollars: 1.0    # a lease reconciles when reconstructed and reported net rent differ by at most this many dollars per month; also the tie margin between candidate assignments
  max_combinations: 4096          # per unit, ambiguous concessions are assigned jointly by trying every candidate combination up to this many; beyond it they stay unresolved

nowcast:
  method: local_linear_trend      # "local_linear_trend" (small state-space model) or "trailing_mean" (simple fallback)
  min_pairs_per_month: 10         # months with fewer pairs are pooled with neighbouring months
  max_pool_months: 3              # a thin month borrows at most this many months on each side; still thin after that = missing
  min_observed_months: 24         # fewer observed months than this and the nowcast falls back to the trailing mean
  fallback_window_months: 12      # months averaged by the trailing-mean fallback
  trend_damping: 0.8              # per-month factor on the fitted slope when projecting (1 = undamped); keeps 12-month projections from running away

combine:
  # Weights are untuned starting values. They may only be re-examined on the selection years (core.yaml forecast_years), never on the 2025 holdout.
  # Within an engine the weights are renormalized over the components that exist for the segment (for example no asking-rent signal).
  history_window_years: 3         # years before the cutoff of segment pair history used by the history component
  min_pairs_history: 5            # a segment-window with fewer pairs uses its province x renewal-flag pool, then the portfolio x renewal-flag pool
  renewal_history_weight: 0.5     # renewals: segment's own recent contractual growth
  renewal_nowcast_weight: 0.5     # renewals: portfolio-wide level from the monthly nowcast (F-04)
  turnover_history_weight: 0.3    # turnovers: segment's own recent contractual growth
  turnover_signal_weight: 0.4     # turnovers: asking-rent signal from MSR (leading indicator, highest weight)
  turnover_nowcast_weight: 0.3    # turnovers: portfolio-wide level from the monthly nowcast
  shrinkage_strength: 20          # pseudo-pairs pulling thin building x beds cells toward their building mean (F-07)

anchors:
  # Regulatory anchors for renewals (E2_regulated) and the B3_tal_anchor baseline. Rates come from the snapshot's external rows (Jan-31 rule).
  tal_metric: tal_renewal_reference_pct   # `metric` in sources.csv for the Québec TAL reference percentage of a lease year
  tal_geography: QC                       # geography code of the TAL rows (and the province whose renewals E2 anchors)
  ontario_metric: ontario_guideline_pct   # `metric` for the Ontario rent increase guideline
  ontario_geography: "ON"                 # geography code of the guideline rows (and the province of the alternative Met scenario); quoted because bare ON parses as a YAML boolean
  gap_window_years: 3                     # training years before the target used to learn gap = actual renewal log growth - log(1 + rate)
  min_pairs_per_gap_year: 5               # a province-year with fewer eligible renewal pairs is skipped when learning the gap
  tal_method_change_year: 2026            # first lease year under the new TAL method; gap learned on older years is flagged, not adjusted
  tal_method_announced: "2025-12-17"      # date of the TAL method change (AGENTS.md 9.3); quoted in notebook text, which reads it from here

sensitivity:
  # One-at-a-time variants for the tornado chart (notebook section 11b); each is run against the base setting, never combined.
  max_gap_alternatives_years: [2.0, 3.0]      # alternative upper bounds of the pair gap (base: measure.yaml pairs.max_gap_years)
  winsor_alternatives: [[0.0, 1.0], [0.05, 0.95]]  # [lower, upper] quantiles: no clipping, and heavier clipping than the base
  weight_window_step_years: 1                 # the weight window is moved by plus and minus this many years
  model_choices: [B0_last_year, B1_trailing_mean, E1_engine_blend, E2_regulated]  # models compared in the model-choice rows

headline_range:
  models: [B0_last_year, B1_trailing_mean, E1_engine_blend, E2_regulated]  # models whose minimum-maximum is quoted as the range of the target-year net increase (notebook section 10.4); B2 and B3 are shown apart

champion:
  top_n: 3                        # number of best models shown in the backtest reading (notebook section 9)

selection:
  metric: mean_absolute_error_pp  # champion metric over selection_years

leakage_test:
  # Used only by tests/test_asof_leakage.py: how the fake future rows are built.
  future_rent_multiplier: 3.0     # fake future rents are this many times the real ones, so any leak moves the forecast visibly
  future_row_count: 5             # number of fake future leases appended per test

scenarios:
  # Low / central / high levers. Sizes come from the real history (counts and means only), justified in docs/assumptions/FCT.md.
  incentive_intensity_shift_pp: 2.0       # +/- shift of every segment's forecast discount share d1; a round illustrative stress size, to be calibrated to your own history
  renewal_share_shift_pp: 5.0             # +/- shift of the renewal share of the frozen weights; a round illustrative stress size, to be calibrated to your own history
  met_guideline_applies: [false, true]    # central: post-2018 exemption plausible; alternative: Ontario guideline applies to the Ontario new-build property's renewals
  include_post_cutoff_quebec_method: false  # unused: the Jan 19 2026 TAL percentage is inside the Jan-31 window, so the new method is already the base case
