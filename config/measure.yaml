# measure.yaml — owned by MSR. INT created the agreed keys; MSR tunes values and adds keys.

pairs:
  unit_key: [prop_code, unit_code]  # safe matching key (sponsor rule); sSite + sUnitCode merges distinct apartments
  cross_check_key: unit_id          # hUnit must map one-to-one onto unit_key; a mismatch is an exclusion reason
  min_gap_years: 0.5              # starter assumption: shorter gaps are usually the same lease recorded twice
  max_gap_years: 2.5              # starter assumption: longer gaps are too old for a like-for-like comparison
  sensitivity_min_gap_years: 0.45 # alternative lower bound that admits every 6-month lease (sensitivity only)

winsorize:
  lower_quantile: 0.01            # clip the lowest 1% of annualized log growth; learned on training pairs only
  upper_quantile: 0.99            # clip the highest 1%; same training-only rule

composition:
  naive_years_start: 2019         # first year shown in the naive vs same-unit comparison
  strata: [prop_code, beds, is_renewal]  # same segments as the headline (core.yaml headline.segment_keys)

renewals:
  min_pairs_per_cell: 5           # a year x province x lease-type cell with fewer eligible pairs shows its count only (growth too noisy to read)

regulation:
  # Reference percentages come from data/public/sources.csv (with release dates), never typed from memory.
  # The matrix below is a reading of public rules for scenario design. It is never a legal determination.
  quebec_regime: TAL
  ontario_regime: ontario_guideline
  ontario_post_2018_exemption_cutoff: "2018-11-15"  # RTA s.6.1: units first occupied as residential after this date are exempt from the guideline
  quebec_new_building_years: 5    # Civil Code art. 1955 (lease clause F): no TAL rent fixing for 5 years after the building is ready for habitation
  reference_metrics:              # public series compared with renewal growth, per province (never cross-applied)
    QC: tal_renewal_reference_pct # TAL reference % for an unheated dwelling: a benchmark used when the TAL fixes rent, not a ceiling
    "ON": ontario_guideline_pct   # Ontario guideline: legal ceiling on renewal increases for non-exempt units (quoted: bare ON is a YAML boolean)
  regimes:                        # rule text shown in section 06 (French: notebook language); one entry per province x lease type
    QC:
      renewal:
        rule: "Hausse négociée ; le locataire peut la refuser et le TAL fixe alors le loyer avec sa méthode de calcul."
        reference_metric: tal_renewal_reference_pct
        binding: false            # the TAL percentage guides a fixing decision; it does not cap an accepted increase
      turnover:
        rule: "Loyer du nouveau locataire fixé par le locateur ; il doit déclarer le plus bas loyer des 12 derniers mois (section G du bail) et le nouveau locataire peut demander au TAL de le fixer."
        reference_metric: ""
        binding: false
    "ON":
      renewal:
        rule: "Hausse limitée par la ligne directrice annuelle, sauf logements exemptés (première occupation résidentielle après le 15 novembre 2018)."
        reference_metric: ontario_guideline_pct
        binding: true             # the guideline caps renewal increases unless the unit is exempt
      turnover:
        rule: "Aucun plafond au changement de locataire (déréglementation à la vacance)."
        reference_metric: ""
        binding: false
  buildings:                      # public facts from the sponsor brief: building name as in the extract and its province
    - building: Building
      province: QC
      scenario: none
    - building: Building
      province: QC
      scenario: none
    - building: Building
      province: QC
      scenario: quebec_new_building   # phase 3 only (first leases in 2025); phases 1-2 are older
    - building: Building
      province: QC
      scenario: quebec_new_building   # first leased in 2023 per the extract
    - building: Building
      province: QC
      scenario: quebec_new_building   # first leased in 2024 per the extract
    - building: the Ontario new-build
      province: "ON"
      scenario: ontario_post_2018_exemption  # first leased in 2023, after the Nov 15 2018 cutoff
  scenarios:                      # what each scenario changes, for renewals only (turnovers are never capped by these rules)
    quebec_new_building:
      central: "Méthode du TAL comme référence (clause F non vérifiée)."
      alternative: "Clause F possible : pas de fixation par le TAL pendant 5 ans, hausse au renouvellement non encadrée."
      central_reference: true     # central keeps the TAL reference line
      alternative_reference: false
    ontario_post_2018_exemption:
      central: "Exemption post-15 novembre 2018 plausible : la ligne directrice ne plafonne pas les renouvellements."
      alternative: "La ligne directrice s'applique aux renouvellements."
      central_reference: false    # matches forecast.yaml scenarios.met_guideline_applies[0] (central = exempt)
      alternative_reference: true
  quebec_method_change_date: "2025-12-17"  # TAL announced the new rent-adjustment method ("pourcentage de base") on this date
  post_cutoff_note: "Québec : le pourcentage du TAL pour {target_year} (publié le {tal_release}) est connu à la date d'information du {info_date} et sert donc d'intrant à la prévision {target_year}. Il est calculé avec la nouvelle méthode annoncée le {method_change} (« pourcentage de base ») : il ne se compare pas directement aux « estimations moyennes » des années antérieures. Avec la coupure stricte du {strict_cutoff} (sensibilité), il {strict_known}."  # placeholders filled in section 06 from config and sources.csv
  exemption_evidence:             # section 06 evidence block for the Ontario post-2018 exemption scenario (the Ontario new-build)
    above_reference_tolerance_pp: 0.05  # a renewal counts as above the guideline only if its 12-month increase exceeds it by more than this (cent rounding)
    law_url: https://www.ontario.ca/page/rent-increase-guideline  # states the exemption; legal text: RTA 2006 s.6.1 (ontario.ca/laws/statute/06r17)
    law_quote: "new buildings, additions to existing buildings and most new basement apartments that are occupied for the first time for residential purposes after November 15, 2018 are exempt from rent control."
    occupancy_url: https://source.ca/project-doubles-down-on-ottawa-with-2nd-downtown-multires-tower  # source, Danny Kucharsky, 2023-06-19 (accessed 2026-10-03)
    occupancy_quote: "Fresh off the completion of its 303-unit the Ontario new-build multiresidential development at 180 Street St. [...] rentals at the Ontario new-build, which began occupancy last month"
    occupancy_source_label: "source, presse spécialisée"  # trade press; no official (City of Ottawa or owner) dated source found (M-08 search)
    occupancy_source_date: "2023-06-19"  # publication date of the source article
    occupancy_start_month: "2023-05"  # "began occupancy last month" in a June 2023 article
    building_units: 303           # units in the Ontario new-build, per the same article
    building_address: "180, rue Street, Ottawa"
    law_citation: "Loi de 2006 sur la location à usage d'habitation, art. 6.1"  # Ontario RTA 2006 s.6.1, named in French

reconcile_market:
  # Internal same-unit growth vs public market series, per province (QC <-> Montreal CMA, ON <-> Ottawa CMA).
  # Descriptive history only: it explains how the extract moves relative to the market, it never feeds the forecast.
  first_year: 2019                # first pair year compared (first year with a full year of prior leases in every public series)
  context_only_metrics: [cmhc_vacancy_rate_pct]  # listed in the provenance table as regional context; never compared, never a project figure
  comparisons:                    # one internal cut vs one public series per province; series_id values are in sources.csv
    - name: cmhc_total
      label: "SCHL, même échantillon, tous logements"
      lease_type: all             # all | renewal | turnover
      beds: null                  # null = every bedroom count
      series: {QC: cmhc_montreal_same_sample_total_all, "ON": cmhc_ottawa_same_sample_total_all}
    - name: rent_cpi
      label: "IPC loyer (StatCan), moyenne annuelle"
      lease_type: all
      beds: null
      series: {QC: statcan_18100004_rent_qc_annual_avg_pct, "ON": statcan_18100004_rent_on_annual_avg_pct}
    - name: cmhc_2br_turnover
      label: "SCHL, 2 chambres, logements avec changement de locataire"
      lease_type: turnover
      beds: 2                     # CMHC publishes the turnover split for 2-bedroom units only
      series: {QC: cmhc_montreal_same_sample_2br_turnover, "ON": cmhc_ottawa_same_sample_2br_turnover}
    - name: cmhc_2br_non_turnover
      label: "SCHL, 2 chambres, logements sans changement de locataire"
      lease_type: renewal
      beds: 2
      series: {QC: cmhc_montreal_same_sample_2br_non_turnover, "ON": cmhc_ottawa_same_sample_2br_non_turnover}

external:
  sources_file: sources.csv       # verified public observations (under data.public_dir); the only file analysis reads
  draft_file: sources_draft.csv   # extraction output awaiting human verification; never read by analysis
  watch_file: sources_watch.csv   # --watch output: live-read observations not yet in sources_file; never read by analysis
  cache_dir: extraction_cache     # cached public page text + LLM answers so extraction reruns without an API key
  extracted_by_values: [manual, llm]  # allowed provenance tags (contract 7.1); script/API pulls count as manual
  metrics:                        # allowed `metric` values; anything else is rejected at load time
    - rent_cpi                    # StatCan rent CPI, annual-average % change (B2 market anchor in forecast.yaml)
    - rent_cpi_index              # StatCan rent CPI monthly index level (2002=100)
    - cmhc_same_sample_rent_growth_pct  # CMHC fixed-sample average rent change, % (turnover split if published)
    - cmhc_vacancy_rate_pct       # CMHC purpose-built vacancy, % — regional market CONTEXT only, never project occupancy
    - tal_renewal_reference_pct   # Québec TAL reference percentage for an unheated dwelling, %
    - ontario_guideline_pct       # Ontario rent increase guideline, %
  announced_ahead_metrics: [ontario_guideline_pct]  # rules published before the year they apply to (RTA: by Aug 31 of y-1); exempt from the "released before period" check
  statcan:
    table_id: "18-10-0004-01"     # Consumer Price Index, monthly, not seasonally adjusted
    product_id: 18100004          # WDS numeric id of the same table
    rent_member_id: 81            # "Rent" in the Products dimension (from getCubeMetadata)
    geography_member_ids: {"QC": 11, "ON": 14}  # Quebec, Ontario (quoted: bare ON parses as YAML boolean) in the Geography dimension
    first_year: 2016              # earliest calendar year pulled (two years before the first pair year, 2018)
    months_requested: 140         # latest N monthly points requested; covers first_year to the latest release
    request_timeout_seconds: 60   # WDS calls are slow; fail rather than hang
  llm:
    model: claude-opus-5-5        # extraction model (reads PUBLIC pages only)
    max_tokens: 16000             # room for a full table of observations
    effort: high                  # careful reading of numeric tables
    max_page_characters: 400000   # refuse (not truncate) pages longer than this; split the source instead
  pages:                          # public pages read by the LLM; human verifies every extracted row
                                  # CMHC: only the latest report page is read by the LLM; 2021-2024 report values were
                                  # added manually from CMHC's rmr workbooks with their own release dates (M-03b)
    - source_id: ontario_guideline
      publisher: Government of Ontario
      url: https://www.ontario.ca/page/rent-increase-guideline
      metric: ontario_guideline_pct
      geography: "ON"
      unit: pct
      instructions: "Every annual rent increase guideline listed, one row per calendar year it applies to, with the date it was announced as release_date."
    - source_id: tal_percentages
      publisher: Tribunal administratif du logement
      url: https://www.tal.gouv.qc.ca/fr/reconduction-du-bail-et-fixation-de-loyer/pourcentages-applicables-aux-criteres-de-fixation-de-loyer
      metric: tal_renewal_reference_pct
      geography: "QC"
      unit: pct
      instructions: "Every rent-adjustment percentage the page gives for an unheated dwelling with no major work (the reference or estimated average increase, or the base rent percentage), one row per lease year it applies to (YYYY-01-01 to YYYY-12-31), with the publication date of the page or announcement as release_date. Put any other component (electricity, gas, taxes) in notes, not as rows."
    - source_id: tal_news_2023
      publisher: Tribunal administratif du logement
      url: https://www.tal.gouv.qc.ca/fr/actualites/le-calcul-de-l-ajustement-des-loyers-en-2023
      metric: tal_renewal_reference_pct
      geography: "QC"
      unit: pct
      instructions: "Every rent-adjustment percentage the page gives for an unheated dwelling with no major work (the reference or estimated average increase, or the base rent percentage), one row per lease year it applies to (YYYY-01-01 to YYYY-12-31), with the publication date of the page or announcement as release_date. Put any other component (electricity, gas, taxes) in notes, not as rows."
    - source_id: tal_news_2025
      publisher: Tribunal administratif du logement
      url: https://www.tal.gouv.qc.ca/fr/actualites/detail?code=le-calcul-de-l-ajustement-des-loyers-en-2025
      metric: tal_renewal_reference_pct
      geography: "QC"
      unit: pct
      instructions: "Every rent-adjustment percentage the page gives for an unheated dwelling with no major work (the reference or estimated average increase, or the base rent percentage), one row per lease year it applies to (YYYY-01-01 to YYYY-12-31), with the publication date of the page or announcement as release_date. Put any other component (electricity, gas, taxes) in notes, not as rows."
    - source_id: tal_news_2026
      publisher: Tribunal administratif du logement
      url: https://www.tal.gouv.qc.ca/fr/actualites/detail?code=le-calcul-de-l-ajustement-des-loyers-en-2026
      metric: tal_renewal_reference_pct
      geography: "QC"
      unit: pct
      instructions: "Every rent-adjustment percentage the page gives for an unheated dwelling with no major work (the reference or estimated average increase, or the base rent percentage), one row per lease year it applies to (YYYY-01-01 to YYYY-12-31), with the publication date of the page or announcement as release_date. Put any other component (electricity, gas, taxes) in notes, not as rows."
    - source_id: cmhc_montreal
      publisher: CMHC
      url: https://www.cmhc-schl.gc.ca/professionals/housing-markets-data-and-research/market-reports/rental-market-reports-major-centres
      metric: cmhc_same_sample_rent_growth_pct
      geography: Montreal CMA
      unit: pct
      instructions: "Same-sample (fixed-sample) average rent change for the Montréal CMA, overall (segment all) and split by turnover vs no turnover (segments turnover, non_turnover) if shown; also the vacancy rate as metric cmhc_vacancy_rate_pct (segment all). Each value refers to the October survey of its year: ref period YYYY-10-01 to YYYY-10-31. Report publication date = release_date."
    - source_id: cmhc_ottawa
      publisher: CMHC
      url: https://www.cmhc-schl.gc.ca/professionals/housing-markets-data-and-research/market-reports/rental-market-reports-major-centres
      metric: cmhc_same_sample_rent_growth_pct
      geography: Ottawa CMA
      unit: pct
      instructions: "Same-sample (fixed-sample) average rent change for the Ottawa (Ontario part) CMA, overall (segment all) and split by turnover vs no turnover (segments turnover, non_turnover) if shown; also the vacancy rate as metric cmhc_vacancy_rate_pct (segment all). Each value refers to the October survey of its year: ref period YYYY-10-01 to YYYY-10-31. Report publication date = release_date."

asking:
  # Turnover leading indicator (market/asking.py). Asking rents are contractual-rent offers; incentives are FCT's engine.
  match_lookback_months: 3        # an asking posted up to this many months before a lease's signing month is that lease's listing
  signal_window_months: 12        # asking rents posted in the last N months before the cutoff feed the signal (one year of listings)
  spread_window_years: 3          # asking→signed spread learned on turnover leases signed in the last N years before the cutoff (same as headline weight window)
  min_listings_per_segment: 5     # a prop_code x beds cell with fewer listed units uses its province pool instead
  min_spread_leases: 10           # a province with fewer matched turnover leases uses the all-province spread instead
  aggregate: median               # "median" or "mean" of per-unit log growth; median resists odd one-off listings

references:
  # Section 12 compiles itself from each track's own references file at build time (no text copied into the notebook).
  dir: docs/references            # one append-only Markdown file per track, owned by that track
  tracks:                         # rendered in this order, one subsection each, with its French title
    INT: Intégration et produit
    MSR: Mesure et marché
    FCT: Incitatifs et prévision
  boilerplate: "Append one bullet per entry, newest last."  # editing instruction at the top of each file; not shown in the notebook
  heading_shift: 2                # a file's "## Heading" becomes "#### Heading" under the "### 12.x" track subsection
  sponsor_approval_date: "2026-10-03"  # sponsor/mentor approved Claude Code processing the CRM CSVs locally (AGENTS.md §3)
