# Newsprint theme of the LeaseLens demo. The five colours repeat the tokens in app/ui/theme.py (a test keeps them equal).
[theme]
base = "light"
backgroundColor = "#f3f2f2"
secondaryBackgroundColor = "#eae9e9"
textColor = "#201e1d"
primaryColor = "#006786"
font = "serif"

[server]
headless = true

[browser]
gatherUsageStats = false
